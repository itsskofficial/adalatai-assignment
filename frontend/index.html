<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Invoice Collection</title>
    <script>
      // The theme goes on <html> before anything is drawn, so a dark page never flashes light.
      // The key is the one src/theme.ts keeps the person's choice under.
      ;(function () {
        try {
          var chosen = localStorage.getItem('theme')
          var dark =
            chosen === 'dark' ||
            (chosen !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          // Without storage or matchMedia the page is light, and the toggle still works.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
